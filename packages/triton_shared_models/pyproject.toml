[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-shared-models"
version = "0.1.0"
description = "Shared Triton type definitions for triton-redis-connector workspace"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "loguru>=0.7.3,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "numpy>=2.4.4,<3.0.0",
    "opencv-python-headless>=4.13.0.92,<5.0.0",
]

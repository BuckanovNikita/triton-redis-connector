[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-model-tools"
version = "0.1.0"
description = "Tools for converting and verifying ultralytics models for Triton"
requires-python = ">=3.12"
dependencies = [
    "triton-shared-models",
    "triton-redis-connector",
    "ultralytics>=8.4.32,<9.0.0",
    "onnx>=1.17.0,<2.0.0",
    "onnxruntime>=1.19.0,<2.0.0",
    "tritonclient[grpc]>=2.55.0,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "loguru>=0.7.3,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "Pillow>=10.4.0,<13.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "redis>=5.2.0,<6.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "fiftyone>=1.14.0",
]

[project.optional-dependencies]
dali = ["nvidia-dali-cuda120>=1.35.0"]

[tool.uv.sources]
triton-shared-models = { workspace = true }
triton-redis-connector = { workspace = true }

[project.scripts]
triton-model-tools = "triton_model_tools.__main__:main"

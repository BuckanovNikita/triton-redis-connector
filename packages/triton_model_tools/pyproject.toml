[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-model-tools"
version = "0.1.0"
description = "Tools for converting and verifying ultralytics models for Triton"
requires-python = ">=3.12"
dependencies = [
    "triton-shared-models",
    "ultralytics>=8.4.0",
    "onnx>=1.20.0",
    "onnxruntime>=1.24.0",
    "tritonclient[all]>=2.66.0",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[tool.uv.sources]
triton-shared-models = { workspace = true }

[project.scripts]
triton-model-tools = "triton_model_tools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-model-tools"
version = "0.1.0"
description = "Tools for converting and verifying ultralytics models for Triton"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "tritonclient[all]>=2.52.0",
    "pydantic>=2.10.0",
    "loguru>=0.7.3",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

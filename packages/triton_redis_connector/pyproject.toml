[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triton-redis-connector"
version = "0.1.0"
description = "Redis Streams to Triton Inference Server connector"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0,<6.0.0",
    "tritonclient[grpc]>=2.55.0,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "loguru>=0.7.3,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "dishka>=1.9.1,<2.0.0",
    "hydra-core>=1.3.2,<2.0.0",
    "omegaconf>=2.3.0,<3.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "PyTurboJPEG>=1.7.0,<2.0.0",
    "triton-shared-models",
]

[tool.uv.sources]
triton-shared-models = { workspace = true }

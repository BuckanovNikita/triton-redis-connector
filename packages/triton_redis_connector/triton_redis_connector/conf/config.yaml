defaults:
  - inference: default
  - preprocessing: default
  - metrics: default
  - _self_

redis:
  host: ${oc.env:REDIS_HOST,localhost}
  port: ${oc.env:REDIS_PORT,6379}
  db: 0
  decode_responses: false

sources: []

sinks: []

queues:
  maxsize: 1000

debug:
  stop_on_error: false
  single_thread: false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typed-flow"
version = "0.1.0"
description = "Generic event-streaming framework with type-based DAG routing"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0,<6.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "loguru>=0.7.3,<1.0.0",
    "dishka>=1.0,<3.0",
]

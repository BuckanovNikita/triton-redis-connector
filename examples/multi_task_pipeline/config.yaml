redis:
  host: ${oc.env:REDIS_HOST,redis}
  port: ${oc.env:REDIS_PORT,6379}
  db: 0
  decode_responses: false

sources:
  - stream_name: ${oc.env:INPUT_STREAM,task:input}
    consumer_group: multi-task
    consumer_name: worker-1
    event_model: ImageTaskInput
    batch_size: 1
    block_ms: 2000

sinks: []

inference:
  grpc_url: ${oc.env:TRITON_GRPC_URL,triton:8001}

queues:
  maxsize: 100

metrics:
  output_stream: metrics
  emit_interval_s: 5.0
  triton_poll_interval_s: 10.0

debug:
  mermaid_path: flow.md

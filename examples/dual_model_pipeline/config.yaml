app_name: dual-model-steel-inspection

redis:
  host: ${oc.env:REDIS_HOST,redis}
  port: ${oc.env:REDIS_PORT,6379}
  db: 0
  decode_responses: false

sources:
  - stream_name: ${oc.env:INPUT_STREAM,steel:inspection_input}
    consumer_group: steel-inspection
    consumer_name: worker-1
    event_model: bytes
    batch_size: 1
    block_ms: 2000

sinks:
  - stream_name: ${oc.env:OUTPUT_STREAM,steel:inspection_results}
    maxlen: 10000

inference:
  grpc_url: ${oc.env:TRITON_GRPC_URL,triton:8001}
  num_inference_workers: 2
  max_concurrent_per_worker: 4

preprocessing:
  decoder: turbojpeg
  decoder_pool_type: thread
  decoder_pool_workers: 4
  default_target_size: [640, 640]

queues:
  maxsize: 100

nodes:
  - name: input_extractor
    class_path: triton_redis_connector.engine.shipped_processors.EnvelopeExtractor
    variant: thread_processor
    params:
      model_class: examples.dual_model_pipeline.events.SteelInspectionInput

  - name: serializer
    class_path: triton_redis_connector.engine.shipped_processors.EventSerializer
    variant: thread_processor

  - name: error_sink
    class_path: triton_redis_connector.engine.shipped_processors.LogErrorSink
    variant: thread_sink

metrics:
  output_stream: metrics
  triton_poll_interval_s: 10.0

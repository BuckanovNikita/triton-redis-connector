redis:
  host: localhost
  port: 6379
  db: 0

sources:
  - stream_name: "camera:input"
    consumer_group: "cv-pipeline"
    event_model: "CameraEvent"
    batch_size: 1
    block_ms: 0

sinks:
  - stream_name: "results:detection"
    maxlen: 100000
    approximate_maxlen: true
    block_ms: 0

  - stream_name: "results:classification"
    maxlen: 100000
    approximate_maxlen: true
    block_ms: 0

metrics:
  output_stream: "metrics:cv-pipeline"
  emit_interval_s: 60.0
  stats_log_interval_s: 5.0

debug:
  stop_on_error: false
  mermaid_path: ""

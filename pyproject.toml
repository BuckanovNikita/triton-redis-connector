[project]
name = "triton-redis-connector-workspace"
version = "0.0.0"
description = "Workspace root for triton-redis-connector and triton-model-tools"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pyright>=1.1.400",
    "pre-commit>=4.1.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "vulture>=2.14",
    "types-redis>=4.6.0",
    "import-linter>=2.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing-trailing-comma - conflicts with ruff formatter
    "ISC001",   # single-line-implicit-string-concatenation - conflicts with formatter
    "EM",       # flake8-errmsg - overly pedantic
    "TRY003",   # raise-vanilla-args - same as EM
    "D213",     # multi-line-summary-second-line
    "D203",     # one-blank-line-before-class
    "RUF001",   # ambiguous-unicode-character - project uses Russian strings
    "PERF203",  # try-except-in-loop - false positive in Python 3.11+
    "PLR2004",  # magic-value-comparison
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "D104", "INP001", "S311", "SLF001", "TC002"]
"**/tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "D104", "INP001", "S311", "SLF001", "TC002"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = [
    "packages/triton_redis_connector",
    "packages/triton_model_tools",
]
exclude = [
    "packages/triton_redis_connector/tests/",
    "packages/triton_model_tools/tests/",
]

[[tool.mypy.overrides]]
module = ["tritonclient.*", "tritonserver.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "loguru", "loguru.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/triton_redis_connector/tests",
    "packages/triton_model_tools/tests",
]
addopts = ["-v", "--tb=short", "-n", "auto"]

[tool.vulture]
min_confidence = 80
paths = [
    "packages/triton_redis_connector/triton_redis_connector",
    "packages/triton_model_tools/triton_model_tools",
]

# ---------------------------------------------------------------------------
# import-linter: architecture contracts
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "triton_redis_connector",
    "triton_model_tools",
]
include_external_packages = false

# Contract 1: Layer hierarchy inside triton_redis_connector
# Layers ordered top-to-bottom; each may only import from layers below.
# Enforces design.md: domain → engine → config/errors → protocols (leaf)
# Parenthesized modules are optional (not yet created).
[[tool.importlinter.contracts]]
id = "connector-layers"
name = "triton_redis_connector layer architecture"
type = "layers"
layers = [
    "(triton_redis_connector.connectors) | (triton_redis_connector.inference) | (triton_redis_connector.preprocessing) | (triton_redis_connector.metrics) | (triton_redis_connector.providers)",
    "(triton_redis_connector.engine)",
    "(triton_redis_connector.config) | (triton_redis_connector.errors)",
    "(triton_redis_connector.protocols)",
]

# Contract 2: Domain modules must not import each other.
# connectors, inference, preprocessing, metrics communicate via engine/graph.
# Uses pipe-delimited independent layer — import-linter enforces no
# cross-imports between modules on the same layer line.
# (Already enforced by connector-layers contract above. Explicit independence
# contract will be added once these modules exist in the codebase.)

# Contract 3: Package boundary — connector must not import model_tools
[[tool.importlinter.contracts]]
id = "connector-no-model-tools"
name = "triton_redis_connector must not import triton_model_tools"
type = "forbidden"
source_modules = [
    "triton_redis_connector",
]
forbidden_modules = [
    "triton_model_tools",
]

# Contract 4: Package boundary — model_tools must not import connector
[[tool.importlinter.contracts]]
id = "model-tools-no-connector"
name = "triton_model_tools must not import triton_redis_connector"
type = "forbidden"
source_modules = [
    "triton_model_tools",
]
forbidden_modules = [
    "triton_redis_connector",
]

# Contract 5: model_tools internal layers
# __main__ (CLI) → exporter (logic) → repository (builder) → models (leaf)
[[tool.importlinter.contracts]]
id = "model-tools-layers"
name = "triton_model_tools layer architecture"
type = "layers"
layers = [
    "triton_model_tools.__main__",
    "triton_model_tools.exporter",
    "triton_model_tools.repository",
    "triton_model_tools.models",
]

[tool.coverage.run]
source = ["triton_redis_connector", "triton_model_tools"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

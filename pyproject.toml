[project]
name = "triton-redis-connector-workspace"
version = "0.0.0"
description = "Workspace root for triton-redis-connector and triton-model-tools"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
triton-25-03 = [
    "tritonclient[grpc]>=2.55.0,<2.56.0",
    "numpy>=1.26.0,<2.0.0",
    "torch>=2.6.0,<2.7.0",
    "torchvision>=0.21.0,<0.22.0",
]
triton-26-02 = [
    "tritonclient[grpc]>=2.66.0,<2.67.0",
    "numpy>=2.4.0,<3.0.0",
    "torch>=2.11.0",
    "torchvision>=0.22.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "triton-25-03" },
        { extra = "triton-26-02" },
    ],
]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
lint = [
    "ruff>=0.15.8,<1.0.0",
    "mypy>=1.19.1,<2.0.0",
    "pyright>=1.1.408,<2.0.0",
    "vulture>=2.16,<3.0.0",
    "import-linter>=2.11,<3.0.0",
    "types-redis>=4.6.0.20241004,<5.0.0",
    "types-tqdm>=4.66.0,<5.0.0",
    "pandas-stubs>=3.0.0.260204",
    "scipy-stubs>=1.17.1.3",
    "types-pygments>=2.19.0.20260402",
    "types-antlr4-python3-runtime>=4.13.0.20260402",
    "types-colorama>=0.4.15.20250801",
    "types-defusedxml>=0.7.0.20260402",
    "types-networkx>=3.6.1.20260402",
    "types-protobuf>=7.34.1.20260403",
    "types-pycocotools>=2.0.0.20240806",
    "types-pywin32>=311.0.0.20260402",
    "types-tabulate>=0.10.0.20260308",
    "types-openpyxl>=3.1.5.20260402",
    "types-python-dateutil>=2.9.0.20260402",
    "types-xlrd>=2.0.0.20251020",
    "types-gevent>=25.9.0.20260402",
    "types-PyYAML>=6.0.12,<7.0.0",
]
test = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
]
dev = [
    "typed-flow",
    "triton-redis-connector",
    "triton-model-tools",
    "triton-shared-models",
    "pre-commit>=4.5.1,<5.0.0",
    "nvitop>=1.6.2",
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv.sources]
typed-flow = { workspace = true }
triton-redis-connector = { workspace = true }
triton-model-tools = { workspace = true }
triton-shared-models = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing-trailing-comma - conflicts with ruff formatter
    "ISC001",   # single-line-implicit-string-concatenation - conflicts with formatter
    "EM",       # flake8-errmsg - overly pedantic
    "TRY003",   # raise-vanilla-args - same as EM
    "D213",     # multi-line-summary-second-line
    "D203",     # one-blank-line-before-class
    "RUF001",   # ambiguous-unicode-character - project uses Russian strings
    "PERF203",  # try-except-in-loop - false positive in Python 3.11+
    "PLR2004",  # magic-value-comparison
    "S701",     # jinja2-autoescape-false - not rendering HTML
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "D104", "D107", "INP001", "S311", "SLF001", "TC002", "ARG002"]
"**/tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "D104", "D107", "INP001", "S311", "SLF001", "TC002", "ARG002"]
"**/scripts/**" = ["ALL"]
"test_fixtures/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107", "INP001", "T201"]
"conftest.py" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107", "INP001"]
"packages/triton_model_tools/triton_model_tools/cli/*.py" = ["PLC0415"]
"packages/triton_model_tools/triton_model_tools/api.py" = ["PLC0415"]
"packages/triton_model_tools/triton_model_tools/benchmarks/fiftyone_export.py" = ["PLC0415"]
"packages/triton_model_tools/triton_model_tools/export/classification_exporter.py" = ["PLC0415"]
"packages/triton_model_tools/triton_model_tools/export/dali.py" = ["PLC0415"]
"examples/**" = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = [
    "packages/typed_flow",
    "packages/triton_redis_connector",
    "packages/triton_model_tools",
    "packages/triton_shared_models",
]
exclude = [
    "packages/typed_flow/tests/",
    "packages/triton_redis_connector/tests/",
    "packages/triton_model_tools/tests/",
    "packages/triton_shared_models/tests/",
    "packages/triton_model_tools/triton_model_tools/export/scripts/",
    "packages/triton_model_tools/triton_model_tools/export/dali.py",
    "model_repository/",
    "test_fixtures/",
    "conftest.py",
    "typings/",
]

[[tool.mypy.overrides]]
module = ["tritonclient.*", "tritonserver.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "onnx.*", "onnxruntime.*", "cv2", "cv2.*", "numpy", "numpy.*", "turbojpeg", "turbojpeg.*", "yaml", "yaml.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["fiftyone", "fiftyone.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nvidia", "nvidia.*", "pynvml", "pynvml.*", "psutil", "psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "loguru", "loguru.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dishka", "dishka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/typed_flow/tests",
    "packages/triton_redis_connector/tests",
    "packages/triton_model_tools/tests",
    "packages/triton_shared_models/tests",
]
addopts = ["-v", "--tb=short", "-n", "auto", "-m", "not integration", "--import-mode=importlib", "--ignore=packages/triton_model_tools/tests/test_dali.py"]
markers = [
    "integration: tests requiring Docker services (Redis, Triton)",
    "benchmark: performance benchmark tests",
    "slow: tests that take > 30 seconds",
    "gpu: tests requiring GPU",
]

[tool.vulture]
min_confidence = 80
ignore_names = ["event", "shared", "envelope", "count", "new_payload", "block_ms", "data", "image", "raw", "message_id", "target_size", "timeout_s", "consumer_group", "input_stream", "output_stream", "end2end", "kwargs", "enable_dynamic_batching", "max_batch_size", "redis_connection_config", "redis_client", "consumer_group_manager", "config", "source_type", "handler"]
paths = [
    "packages/typed_flow/typed_flow",
    "packages/triton_redis_connector/triton_redis_connector",
    "packages/triton_model_tools/triton_model_tools",
    "packages/triton_shared_models/triton_shared_models",
]

# ---------------------------------------------------------------------------
# import-linter: architecture contracts
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "typed_flow",
    "triton_redis_connector",
    "triton_model_tools",
    "triton_shared_models",
]
include_external_packages = false

# Contract 1: typed_flow internal layer hierarchy
[[tool.importlinter.contracts]]
id = "typed-flow-layers"
name = "typed_flow layer architecture"
type = "layers"
layers = [
    "(typed_flow.connectors) | (typed_flow.metrics) | (typed_flow.di)",
    "(typed_flow.engine)",
    "(typed_flow.config) | (typed_flow.errors)",
    "(typed_flow.protocols)",
]
ignore_imports = [
    "typed_flow.engine.metric_aggregator -> typed_flow.metrics.collector",
    "typed_flow.engine.app -> typed_flow.metrics.buffer",
    "typed_flow.engine.app -> typed_flow.metrics.emitter",
    "typed_flow.engine.diagram -> typed_flow.metrics.collector",
]

# Contract 2: typed_flow must not import triton_redis_connector or triton_model_tools
[[tool.importlinter.contracts]]
id = "typed-flow-independence"
name = "typed_flow must not import triton packages"
type = "forbidden"
source_modules = [
    "typed_flow",
]
forbidden_modules = [
    "triton_redis_connector",
    "triton_model_tools",
]

# Contract 3: triton_redis_connector internal layers
[[tool.importlinter.contracts]]
id = "connector-layers"
name = "triton_redis_connector layer architecture"
type = "layers"
layers = [
    "(triton_redis_connector.inference) | (triton_redis_connector.preprocessing) | (triton_redis_connector.metrics)",
    "(triton_redis_connector.engine)",
    "(triton_redis_connector.config) | (triton_redis_connector.errors)",
]
ignore_imports = [
    "triton_redis_connector.engine.shipped_processors -> triton_redis_connector.inference.request",
    "triton_redis_connector.engine.shipped_processors -> triton_redis_connector.errors.models",
    "triton_redis_connector.engine.shipped_processors -> triton_redis_connector.preprocessing.decoder",
    "triton_redis_connector.engine.shipped_processors -> triton_redis_connector.preprocessing.protocols",
]

# Contract 4: triton_redis_connector must not import model_tools
[[tool.importlinter.contracts]]
id = "connector-no-model-tools"
name = "triton_redis_connector must not import triton_model_tools"
type = "forbidden"
source_modules = [
    "triton_redis_connector",
]
forbidden_modules = [
    "triton_model_tools",
]

# Contract 5: shared_models must not import any other workspace package
[[tool.importlinter.contracts]]
id = "shared-models-independence"
name = "triton_shared_models must not import connector or model_tools"
type = "forbidden"
source_modules = [
    "triton_shared_models",
]
forbidden_modules = [
    "typed_flow",
    "triton_redis_connector",
    "triton_model_tools",
]

# Contract 6: model_tools internal layers
[[tool.importlinter.contracts]]
id = "model-tools-layers"
name = "triton_model_tools layer architecture"
type = "layers"
layers = [
    "triton_model_tools.__main__",
    "triton_model_tools.cli | triton_model_tools.api",
    "triton_model_tools.benchmarks",
    "triton_model_tools.testing",
    "triton_model_tools.inference | triton_model_tools.export",
    "triton_model_tools.models",
    "triton_model_tools.triton_config",
]

[tool.coverage.run]
source = ["typed_flow", "triton_redis_connector", "triton_model_tools", "triton_shared_models"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

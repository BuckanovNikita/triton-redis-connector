[project]
name = "triton-redis-connector-workspace"
version = "0.0.0"
description = "Workspace root for triton-redis-connector and triton-model-tools"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
lint = [
    "ruff>=0.15.8,<1.0.0",
    "mypy>=1.19.1,<2.0.0",
    "pyright>=1.1.408,<2.0.0",
    "vulture>=2.16,<3.0.0",
    "import-linter>=2.11,<3.0.0",
    "types-redis>=4.6.0.20241004,<5.0.0",
]
test = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
]
dev = [
    "triton-redis-connector",
    "triton-model-tools",
    "triton-shared-models",
    "pre-commit>=4.5.1,<5.0.0",
    "nvitop>=1.6.2",
    { include-group = "lint" },
    { include-group = "test" },
]

[tool.uv.sources]
triton-redis-connector = { workspace = true }
triton-model-tools = { workspace = true }
triton-shared-models = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing-trailing-comma - conflicts with ruff formatter
    "ISC001",   # single-line-implicit-string-concatenation - conflicts with formatter
    "EM",       # flake8-errmsg - overly pedantic
    "TRY003",   # raise-vanilla-args - same as EM
    "D213",     # multi-line-summary-second-line
    "D203",     # one-blank-line-before-class
    "RUF001",   # ambiguous-unicode-character - project uses Russian strings
    "PERF203",  # try-except-in-loop - false positive in Python 3.11+
    "PLR2004",  # magic-value-comparison
    "S701",     # jinja2-autoescape-false - not rendering HTML
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "D104", "D107", "INP001", "S311", "SLF001", "TC002", "ARG002"]
"**/tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "D104", "D107", "INP001", "S311", "SLF001", "TC002", "ARG002"]
"**/scripts/**" = ["ALL"]
"test_fixtures/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107", "INP001", "T201"]
"conftest.py" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107", "INP001"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = [
    "packages/triton_redis_connector",
    "packages/triton_model_tools",
    "packages/triton_shared_models",
]
exclude = [
    "packages/triton_redis_connector/tests/",
    "packages/triton_model_tools/tests/",
    "packages/triton_shared_models/tests/",
    "packages/triton_model_tools/triton_model_tools/export/scripts/",
    "model_repository/",
    "model_repository_offline/",
    "test_fixtures/",
    "conftest.py",
]

[[tool.mypy.overrides]]
module = ["tritonclient.*", "tritonserver.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "onnx.*", "onnxruntime.*", "cv2", "cv2.*", "numpy", "numpy.*", "fiftyone", "fiftyone.*", "turbojpeg", "turbojpeg.*", "yaml", "yaml.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["nvidia", "nvidia.*", "pynvml", "pynvml.*", "psutil", "psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "loguru", "loguru.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/triton_redis_connector/tests",
    "packages/triton_model_tools/tests",
    "packages/triton_shared_models/tests",
]
addopts = ["-v", "--tb=short", "-n", "auto", "-m", "not integration", "--import-mode=importlib"]
markers = [
    "integration: tests requiring Docker services (Redis, Triton)",
    "benchmark: performance benchmark tests",
    "slow: tests that take > 30 seconds",
    "gpu: tests requiring GPU",
]

[tool.vulture]
min_confidence = 80
ignore_names = ["event", "shared", "envelope", "count", "new_payload", "block_ms", "data", "image", "raw", "message_id", "target_size", "timeout_s", "consumer_group", "input_stream", "output_stream", "end2end", "kwargs", "enable_dynamic_batching", "max_batch_size"]
paths = [
    "packages/triton_redis_connector/triton_redis_connector",
    "packages/triton_model_tools/triton_model_tools",
    "packages/triton_shared_models/triton_shared_models",
]

# ---------------------------------------------------------------------------
# import-linter: architecture contracts
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "triton_redis_connector",
    "triton_model_tools",
    "triton_shared_models",
]
include_external_packages = false

# Contract 1: Layer hierarchy inside triton_redis_connector
# Layers ordered top-to-bottom; each may only import from layers below.
# Enforces layer architecture: domain → engine → config/errors → protocols (leaf)
# Parenthesized modules are optional (not yet created).
[[tool.importlinter.contracts]]
id = "connector-layers"
name = "triton_redis_connector layer architecture"
type = "layers"
layers = [
    "(triton_redis_connector.providers)",
    "(triton_redis_connector.connectors) | (triton_redis_connector.inference) | (triton_redis_connector.preprocessing) | (triton_redis_connector.metrics) | (triton_redis_connector.routers)",
    "(triton_redis_connector.engine)",
    "(triton_redis_connector.config) | (triton_redis_connector.errors)",
    "(triton_redis_connector.protocols)",
]
ignore_imports = [
    "triton_redis_connector.engine.metric_aggregator -> triton_redis_connector.metrics.collector",
    "triton_redis_connector.engine.app -> triton_redis_connector.metrics.buffer",
    "triton_redis_connector.engine.app -> triton_redis_connector.metrics.emitter",
    "triton_redis_connector.engine.shipped_processors -> triton_redis_connector.inference.request",
    "triton_redis_connector.engine.shipped_processors -> triton_redis_connector.errors.models",
]

# Contract 2: Domain modules must not import each other.
# connectors, inference, preprocessing, metrics communicate via engine/graph.
# Uses pipe-delimited independent layer — import-linter enforces no
# cross-imports between modules on the same layer line.
# (Already enforced by connector-layers contract above. Explicit independence
# contract will be added once these modules exist in the codebase.)

# Contract 3: Package boundary — connector must not import model_tools
[[tool.importlinter.contracts]]
id = "connector-no-model-tools"
name = "triton_redis_connector must not import triton_model_tools"
type = "forbidden"
source_modules = [
    "triton_redis_connector",
]
forbidden_modules = [
    "triton_model_tools",
]

# Contract 4: (removed — model_tools now depends on connector)

# Contract 5: Package boundary — shared_models must not import connector or model_tools
[[tool.importlinter.contracts]]
id = "shared-models-independence"
name = "triton_shared_models must not import connector or model_tools"
type = "forbidden"
source_modules = [
    "triton_shared_models",
]
forbidden_modules = [
    "triton_redis_connector",
    "triton_model_tools",
]

# Contract 6: model_tools internal layers
# __main__ (CLI) → benchmarks → testing → inference/export → models (leaf)
[[tool.importlinter.contracts]]
id = "model-tools-layers"
name = "triton_model_tools layer architecture"
type = "layers"
layers = [
    "triton_model_tools.__main__",
    "triton_model_tools.cli",
    "triton_model_tools.benchmarks",
    "triton_model_tools.testing",
    "triton_model_tools.inference | triton_model_tools.export",
    "triton_model_tools.models",
]

[tool.coverage.run]
source = ["triton_redis_connector", "triton_model_tools", "triton_shared_models"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
